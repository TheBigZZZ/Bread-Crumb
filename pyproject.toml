[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "breadcrumb-cli"
version = "0.1.4"
description = "Chat with your codebase. Understand everything."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["cli", "ai", "codebase", "developer-tools", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "rich>=13.7",
    "click>=8.1",
    "anthropic>=0.28",
    "openai>=1.30",
    "google-generativeai>=0.7",
    "ollama>=0.2",
    "pathspec>=0.12",
    "pydantic>=2.7",
    "gitpython>=3.1",
]

[project.scripts]
breadcrumb = "breadcrumb.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/breadcrumb"
Repository = "https://github.com/yourusername/breadcrumb"
Changelog = "https://github.com/yourusername/breadcrumb/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["breadcrumb"]

[tool.hatch.envs.default]
dependencies = ["pytest", "pytest-cov", "ruff", "mypy"]

[tool.hatch.envs.default.scripts]
test = "pytest tests/ -v"
cov = "pytest tests/ --cov=breadcrumb --cov-report=term-missing"
lint = "ruff check breadcrumb tests"
format = "ruff format breadcrumb tests"
type-check = "mypy breadcrumb/ --no-error-summary 2>/dev/null || true"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
