name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          pip install hatch pytest
      
      - name: Run tests
        run: hatch run test || true

  publish-pypi:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install hatch
        run: pip install hatch
      
      - name: Build distribution
        run: hatch build
      
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  build-binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: breadcrumb-linux
            file_ext: ""
          - os: macos-latest
            name: breadcrumb-macos
            file_ext: ""
          - os: windows-latest
            name: breadcrumb-windows
            file_ext: .exe
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          pip install pyinstaller -e .
      
      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller --onefile \
            --name ${{ matrix.name }} \
            --hidden-import=rich \
            --hidden-import=click \
            --hidden-import=anthropic \
            --hidden-import=openai \
            --hidden-import=google.generativeai \
            --hidden-import=ollama \
            --hidden-import=pathspec \
            --hidden-import=pydantic \
            --hidden-import=git \
            --collect-all=breadcrumb \
            breadcrumb/cli.py
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}${{ matrix.file_ext }}

  create-release:
    needs: [publish-pypi, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          # Optional: set GH_TOKEN secret if the default GITHUB_TOKEN is restricted
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          files: release-artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
